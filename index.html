<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PDF COMIC MODE</title>



  <link rel="stylesheet" href="style.css" />
</head>

<body>

<div class="controls">
  <input type="file" id="pdfInput" accept=".pdf"/>
  <button id="convertBtn">Carregar PDF</button>
</div>

<div class="flipbook"></div>
<script src="jquery.js"></script>
<script src="turn.js"></script>
<script type="module">

  import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.3.136/pdf.min.mjs";

  pdfjsLib.GlobalWorkerOptions.workerSrc =
          "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.3.136/pdf.worker.min.mjs";

  const input = document.getElementById("pdfInput");
  const btn = document.getElementById("convertBtn");
  const flipbook = $(".flipbook");

  btn.addEventListener("click", async () => {

    const file = input.files[0];
    if (!file) return alert("Selecione um PDF");

    flipbook.html("");

    const pdf = await pdfjsLib.getDocument({
      data: await file.arrayBuffer()
    }).promise;

    for (let i = 1; i <= pdf.numPages; i++) {

      const page = await pdf.getPage(i);

      const viewport = page.getViewport({ scale: 2 });

      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      canvas.width = viewport.width;
      canvas.height = viewport.height;

      await page.render({
        canvasContext: ctx,
        viewport
      }).promise;

      const img = document.createElement("img");
      img.src = canvas.toDataURL("image/png");

      const div = document.createElement("div");
      div.appendChild(img);

      flipbook.append(div);
    }

    // 🔥 comportamento HQ igual seu COMIC
    flipbook.turn({
      autoCenter: true,
      width: 1300,
      height: 700
    });

  });

</script>
<script>

  const flipbookElement =
          document.querySelector(".flipbook");

  let scale = 1;

  let mouseX = 0;
  let mouseY = 0;

  document.addEventListener(
          "mousemove",
          (e) => {

            mouseX = e.clientX;
            mouseY = e.clientY;

          }
  );

  document.addEventListener(
          "wheel",
          (e) => {

            e.preventDefault();

            const delta =
                    e.deltaY * -0.001;

            scale += delta;

            scale =
                    Math.min(
                            Math.max(1, scale),
                            5
                    );

            const rect =
                    flipbookElement.getBoundingClientRect();

            const x =
                    ((mouseX - rect.left) / rect.width) * 100;

            const y =
                    ((mouseY - rect.top) / rect.height) * 100;

            flipbookElement.style.transformOrigin =
                    `${x}% ${y}%`;

            flipbookElement.style.transform =
                    `scale(${scale})`;

          },
          { passive:false }
  );

</script>

</body>
</html>
