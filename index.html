  <script src="jquery.js"></script>

  <script>
    $(".flipbook").turn();
  </script>
  <script>
  const flipbook = document.querySelector(".flipbook");

  let scale = 1;

  // POSIÇÃO DO MOUSE
  let mouseX = 0;
  let mouseY = 0;

  document.addEventListener("mousemove", (e) => {

    mouseX = e.clientX;
    mouseY = e.clientY;

  });

  // ZOOM NO SCROLL
  document.addEventListener("wheel", (e) => {

    e.preventDefault();

    // DIREÇÃO DO SCROLL
    const delta =
      e.deltaY * -0.001;

    // ALTERA SCALE
    scale += delta;

    // LIMITES
    scale = Math.min(Math.max(1, scale), 5);

    // POSIÇÃO RELATIVA
    const rect =
      flipbook.getBoundingClientRect();

    const x =
      ((mouseX - rect.left) / rect.width) * 100;

    const y =
      ((mouseY - rect.top) / rect.height) * 100;

    // DEFINE ORIGEM DO ZOOM
    flipbook.style.transformOrigin =
      `${x}% ${y}%`;

    // APLICA ZOOM
    flipbook.style.transform =
      `scale(${scale})`;

  }, { passive:false });
</script>
